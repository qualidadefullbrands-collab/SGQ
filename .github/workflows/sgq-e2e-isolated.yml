name: SGQ · QC E2E Isolado (Playwright)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-qa:
    name: Chromium desktop e mobile · dados sintéticos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de testes
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E sem chamadas ou gravações externas
        run: npm run test:e2e
      - name: Evidências de testes, screenshots e traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgq-playwright-qc-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
