name: SGQ · Preview operacional Word
on:
  push:
    branches: [preview/sgq-operacional-word]
    paths: ['preview-operacional/**', '.github/workflows/sgq-preview-word.yml']
jobs:
  preview-word:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx==1.2.0 playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check preview-operacional/app.js && node --check preview-operacional/word.js
      - run: python preview-operacional/test_word.py
